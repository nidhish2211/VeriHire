site_name: VeriHire
site_description: AI-Powered Resume Verification and Hiring Platform
site_author: VeriHire Team

repo_name: nidhish2211/VeriHire
repo_url: https://github.com/nidhish2211/VeriHire

theme:
  name: material

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

nav:
  - Home: index.md
  - Project:
      - Problem Statement: problem-statement.md
      - Objectives: objectives.md
      - Methodology: methodology.md
      - System Architecture: architecture.md
      - Implementation: implementation.md
  - Journals:
      - Journal Home: journals/index.md