site_name: VeriHire
site_description: AI-Powered Resume Verification and Hiring Platform
site_author: VeriHire Team

repo_name: nidhish2211/VeriHire
repo_url: https://github.com/nidhish2211/VeriHire

theme:
  name: material
  logo: logo.jpg

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - scheme: default
      primary: indigo
      accent: indigo

nav:
  - Home: index.md
  - Journals:
      - Journal Home: journals/index.md